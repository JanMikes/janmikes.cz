# Builds and deploys janmikes.cz to GitHub Pages.
# Runs on every push to master and once a day, so the "last 12 months"
# activity strip stays current without committing anything back.
name: Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the talks page's real last-modified date

      - name: Refresh GitHub activity strip
        # On an API hiccup, deploy the snapshot committed in index.html instead of failing.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/activity.py janmikes

      - name: Collect public files
        run: |
          mkdir _site
          cp -r index.html slides assets favicon.svg favicon.ico apple-touch-icon.png robots.txt llms.txt sitemap.xml CNAME _site/

      - name: Stamp sitemap dates
        # Home changes daily (activity band); every other page is dated by its file's last commit.
        run: |
          python3 - <<'EOF'
          import datetime, re, subprocess
          path = "_site/sitemap.xml"
          today = datetime.date.today().isoformat()

          def lastmod(match):
              loc = match.group(1)
              page = loc.removeprefix("https://janmikes.cz/")
              if not page:
                  date = today
              else:
                  log = ["git", "log", "-1", "--format=%cs", "--", f"{page}index.html"]
                  date = subprocess.run(log, capture_output=True, text=True).stdout.strip() or today
              return f"<loc>{loc}</loc>\n    <lastmod>{date}</lastmod>"

          xml = open(path).read()
          xml = re.sub(r"<loc>([^<]+)</loc>\s*<lastmod>[^<]*</lastmod>", lastmod, xml)
          open(path, "w").write(xml)
          EOF

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
